    <script>
      (() => {
        try {
          const s = JSON.parse(localStorage.getItem('sekai_custom_stage_settings_v1') || '{}');
          const valid = ['light', 'pink', 'mint', 'gold', 'dark', 'cyber', 'system'];
          const preference = valid.includes(s.appTheme)
            ? s.appTheme
            : ['nightcord', 'vivid'].includes(s.sekaiTheme)
            ? 'dark'
            : 'system';
          const theme =
            preference === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          const colors = {
            light: '#edf5f5',
            pink: '#fbeaf0',
            mint: '#ebf5ff',
            gold: '#fff4e6',
            dark: '#141520',
            cyber: '#091020',
          };
          const isDark = theme === 'dark' || theme === 'cyber';
          const root = document.documentElement;
          root.dataset.appTheme = theme;
          root.dataset.appContrast = s.highContrast === true ? 'high' : 'normal';
          root.dataset.appMotion = s.reduceMotion === true ? 'reduced' : 'system';
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.backgroundColor = colors[theme] || '#edf5f5';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', root.style.backgroundColor);
        } catch (_) {
          document.documentElement.dataset.appTheme = 'light';
        }
      })();
    </script>
