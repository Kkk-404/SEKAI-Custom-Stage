<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#131c36"/>
      <stop offset="100%" stop-color="#221338"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#39C5BB" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#39C5BB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#ff4f93" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff4f93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39C5BB"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff4f93"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090d1e" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glowTeal)"/>
    <rect width="1200" height="380" fill="url(#glowPink)"/>

    <!-- Subtle prism grid -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <line x1="0" y1="95" x2="1200" y2="95"/>
      <line x1="0" y1="190" x2="1200" y2="190"/>
      <line x1="0" y1="285" x2="1200" y2="285"/>
      <line x1="200" y1="0" x2="200" y2="380"/>
      <line x1="400" y1="0" x2="400" y2="380"/>
      <line x1="600" y1="0" x2="600" y2="380"/>
      <line x1="800" y1="0" x2="800" y2="380"/>
      <line x1="1000" y1="0" x2="1000" y2="380"/>
    </g>

    <!-- Decorative floating shards -->
    <polygon points="90,58 118,86 90,114 62,86" fill="#39C5BB" fill-opacity="0.16" stroke="#39C5BB" stroke-opacity="0.45" stroke-width="1.5"/>
    <polygon points="735,62 754,81 735,100 716,81" fill="#ff4f93" fill-opacity="0.16" stroke="#ff4f93" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="655" cy="300" r="4" fill="#67e8f9" opacity="0.7"/>
    <circle cx="1140" cy="70" r="3" fill="#f472b6" opacity="0.75"/>

    <!-- Top prism accent line -->
    <rect x="0" y="0" width="1200" height="5" fill="url(#accentBar)"/>

    <!-- Left side: Emblem + Title + Tagline -->
    <g transform="translate(68, 72)">
      <!-- 01 Emblem -->
      <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#accentBar)"/>
      <polygon points="31,9 53,31 31,53 9,31" fill="#ffffff" fill-opacity="0.22"/>
      <polygon points="31,15 47,31 31,47 15,31" fill="#ffffff"/>
      <text x="31" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#131c36">01</text>

      <!-- Pill eyebrow -->
      <rect x="78" y="14" width="230" height="28" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#39C5BB" stroke-opacity="0.5"/>
      <circle cx="94" cy="28" r="4" fill="#39C5BB"/>
      <text x="106" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" fill="#a5f3fc">HATSUNE MIKU · 4-LANE LIVE</text>

      <!-- Main Title -->
      <text x="0" y="122" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1" fill="url(#titleGrad)">SEKAI: Custom Stage</text>

      <!-- Subtitle -->
      <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#cbd5e1">Загружай свои треки, ставь 2DMV и создавай чарты</text>
      <text x="0" y="186" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94a3b8">Автономный запуск на ПК · Нативный Android APK (v1.1.0)</text>

      <!-- Bottom quick pills -->
      <g transform="translate(0, 214)">
        <rect x="0" y="0" width="128" height="34" rx="10" fill="#39C5BB" fill-opacity="0.18" stroke="#39C5BB" stroke-opacity="0.65"/>
        <text x="64" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#67e8f9">6 СЛОЖНОСТЕЙ</text>

        <rect x="140" y="0" width="114" height="34" rx="10" fill="#ff4f93" fill-opacity="0.18" stroke="#ff4f93" stroke-opacity="0.65"/>
        <text x="197" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#f9a8d4">BPM + 2DMV</text>

        <rect x="266" y="0" width="132" height="34" rx="10" fill="#a855f7" fill-opacity="0.18" stroke="#c084fc" stroke-opacity="0.65"/>
        <text x="332" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#e9d5ff">6 ТЕМ + HAPTICS</text>
      </g>
    </g>

    <!-- Right side: Stylized 4-Lane 3D Highway Preview -->
    <g transform="translate(760, 26)">
      <!-- Highway Perspective Road -->
      <polygon points="145,24 275,24 385,304 35,304" fill="url(#roadGrad)" stroke="url(#accentBar)" stroke-width="2"/>

      <!-- Lane dividers -->
      <line x1="177.5" y1="24" x2="122.5" y2="304" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
      <line x1="210" y1="24" x2="210" y2="304" stroke="#39C5BB" stroke-opacity="0.32" stroke-width="1.5"/>
      <line x1="242.5" y1="24" x2="297.5" y2="304" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>

      <!-- Green S-curve Slide ribbon -->
      <path d="M 155,70 C 155,115 262,125 256,176 L 292,176 C 296,125 190,115 190,70 Z" fill="#34d399" fill-opacity="0.45" stroke="#6ee7b7" stroke-width="1.5"/>

      <!-- Notes -->
      <!-- Critical gold note -->
      <rect x="134" y="64" width="56" height="10" rx="5" fill="#fde047" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Cyan tap note -->
      <rect x="218" y="114" width="60" height="11" rx="5" fill="#39C5BB" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Pink flick note with chevron -->
      <rect x="92" y="196" width="76" height="13" rx="6" fill="#ff4f93" stroke="#ffffff" stroke-width="1.6"/>
      <polyline points="120,190 130,178 140,190" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Trace diamond -->
      <rect x="234" y="170" width="68" height="8" rx="4" fill="#a7f3d0" stroke="#10b981" stroke-width="1.2"/>
      <polygon points="268,164 278,174 268,184 258,174" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Judgment line -->
      <line x1="35" y1="276" x2="385" y2="276" stroke="url(#accentBar)" stroke-width="3.5"/>

      <!-- 4 Symmetrical Glass Tap Pads -->
      <g transform="translate(35, 286)">
        <rect x="4" y="0" width="80" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#39C5BB" stroke-opacity="0.7"/>
        <text x="44" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="900" font-size="13" fill="#67e8f9">D</text>

        <rect x="92" y="0" width="80" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="132" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="900" font-size="13" fill="#bae6fd">F</text>

        <rect x="180" y="0" width="80" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.7"/>
        <text x="220" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="900" font-size="13" fill="#e9d5ff">J</text>

        <rect x="268" y="0" width="80" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#ff4f93" stroke-opacity="0.7"/>
        <text x="308" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="900" font-size="13" fill="#fbcfe8">K</text>
      </g>

      <!-- Floating ALL PERFECT badge -->
      <rect x="274" y="18" width="128" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#fde047" stroke-width="1.5"/>
      <text x="338" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#fde047">✦ ALL PERFECT</text>
    </g>
  </g>
</svg>
